minecraft_version=1.21.11

# Versiones de Minecraft en las que se acepta este jar (con límite superior:
# si no, el loader lo cargaría en versiones incompatibles y el juego crashearía)
mc_range_fabric=1.21.11
mc_range_forge=[1.21.11,1.21.12)
loader_version=0.19.2

# Fabric API
fabric_version=0.141.6+1.21.11
# NeoForge
neoforge_version=21.11.42
# Mod Menu (solo Fabric, opcional: abre la config de Bloomberto)
modmenu_version=17.0.1
# Sodium e Iris (solo para probar la compatibilidad en runClient: -Pstormroot.renderMods=sodium,iris)
# Iris exige una versión concreta de Sodium (sodium_iris_version: la de su página de Modrinth).
sodium_version=mc1.21.11-0.8.14-fabric
iris_version=1.10.8+1.21.11-fabric
sodium_iris_version=mc1.21.11-0.8.14-fabric
