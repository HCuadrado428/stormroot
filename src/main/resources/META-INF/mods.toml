modLoader = "javafml"
loaderVersion = "*"
license = "MIT"
issueTrackerURL = "https://github.com/HCuadrado428/stormroot/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "HCuadrado428"
description = '''
${description}
'''
displayURL = "https://github.com/HCuadrado428/stormroot"
logoFile = "assets/${id}/icon.png"
logoBlur = false

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[${forgeLoaderVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mcRangeForge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "bloomberto"
mandatory = false
versionRange = "[0.2.0,)"
ordering = "NONE"
side = "BOTH"
