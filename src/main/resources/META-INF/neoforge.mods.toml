modLoader = "javafml"
loaderVersion = "*"
license = "MIT"
issueTrackerURL = "https://github.com/HCuadrado428/stormroot/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "HCuadrado428"
description = '''
${description}
'''
displayURL = "https://github.com/HCuadrado428/stormroot"
logoFile = "assets/${id}/icon.png"
logoBlur = false

[[mixins]]
config = "stormroot-sky.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mcRangeForge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "bloomberto"
type = "optional"
versionRange = "[0.2.0,)"
ordering = "NONE"
side = "BOTH"
