name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 + 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 ejecuta Gradle/Stonecraft; 17 y 21 compilan los targets de cada versión.
          java-version: |
            17
            21
            25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bloomberto (opcional): se compila desde su repo en el commit de bloomberto.ref y se guarda en caché.
      - name: Caché de Bloomberto
        uses: actions/cache@v4
        with:
          path: libs/bloomberto
          key: bloomberto-${{ hashFiles('bloomberto.ref') }}

      - name: Compilar Bloomberto
        run: |
          chmod +x scripts/fetch-bloomberto.sh
          scripts/fetch-bloomberto.sh

      - name: Build (todas las versiones y loaders)
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndCollect --stacktrace

      - name: Comprobar datos por versión dentro de los jars
        run: |
          set -e
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar|*-dev.jar) continue;; esac
            echo "== $jar"
            unzip -l "$jar" | grep -E "data/stormroot/(recipes?|loot_tables?)/" || { echo "Faltan recetas/loot tables en $jar"; exit 1; }
            case "$jar" in
              *1.20.1*) unzip -l "$jar" | grep -q "data/stormroot/recipes/" || { echo "1.20.1 debe usar recipes/"; exit 1; } ;;
              *)        unzip -l "$jar" | grep -q "data/stormroot/recipe/"  || { echo "1.21+ debe usar recipe/"; exit 1; } ;;
            esac
          done

      - name: Subir jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/*.jar
            libs/bloomberto/*.jar
            versions/*/build/reports/**/*

      # Los jars también van al log en base64, en trozos ("JAR-B64 <nombre> <n.º> <datos>"), para quien no puede bajar
      # artefactos. GitHub descarta las líneas muy largas, así que cada trozo tiene 60 000 caracteres como mucho.
      - name: Jars en el log
        if: success()
        run: |
          for jar in build/libs/*.jar libs/bloomberto/*.jar; do
            [ -f "$jar" ] || continue
            case "$jar" in *-sources.jar|*-dev.jar) continue;; esac
            name=$(basename "$jar")
            i=0
            base64 -w 60000 "$jar" | while read -r chunk; do
              echo "JAR-B64 $name $i $chunk"
              i=$((i + 1))
            done
          done

      # Publicación: crea una Release en GitHub y se publica en Modrinth/CurseForge.
      # Configura en Settings > Secrets and variables > Actions:
      #   secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN
      #   variables: MODRINTH_ID, CURSEFORGE_ID, CURSEFORGE_SLUG
      - name: Publicar en Modrinth y CurseForge
        if: github.event_name == 'release'
        env:
          DO_PUBLISH: "true"
          RELEASE_TYPE: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_SLUG: ${{ vars.CURSEFORGE_SLUG }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew publishMods --stacktrace

  # Pruebas dentro del juego (scripts/selftest.sh): servidor dedicado y un jugador en una pantalla virtual.
  selftest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.11-fabric
          - 1.21.11-neoforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Caché de Bloomberto
        uses: actions/cache@v4
        with:
          path: libs/bloomberto
          key: bloomberto-${{ hashFiles('bloomberto.ref') }}

      - name: Compilar Bloomberto
        run: |
          chmod +x scripts/fetch-bloomberto.sh
          scripts/fetch-bloomberto.sh

      - name: Pantalla virtual y OpenGL por software
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick

      - name: Self-test servidor (${{ matrix.target }})
        run: |
          chmod +x ./gradlew scripts/selftest.sh
          scripts/selftest.sh server ${{ matrix.target }}

      - name: Self-test cliente (${{ matrix.target }})
        run: scripts/selftest.sh client ${{ matrix.target }}

      - name: Capturas del self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-capturas-${{ matrix.target }}
          path: build/selftest-shots/
          if-no-files-found: ignore

      - name: Logs del self-test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs-${{ matrix.target }}
          path: |
            build/selftest-logs/
            run/logs/

  # Compatibilidad con mods de render (solo Fabric): el self-test del cliente con Sodium y con Sodium + Iris.
  selftest-render:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.21.1-fabric
          - 1.21.11-fabric
        mods:
          - sodium
          - sodium,iris
        shaders: [""]
        include:
          # Iris con un pack de shaders de verdad (en OpenGL por software va muy lento; solo para ver qué se dibuja).
          - target: 1.21.11-fabric
            mods: sodium,iris
            shaders: https://cdn.modrinth.com/data/HVnmMxH1/versions/RKfUB9VC/ComplementaryReimagined_r5.10.zip
          - target: 1.21.1-fabric
            mods: sodium,iris
            shaders: https://cdn.modrinth.com/data/HVnmMxH1/versions/RKfUB9VC/ComplementaryReimagined_r5.10.zip
          - target: 1.20.1-fabric
            mods: sodium,iris
            shaders: https://cdn.modrinth.com/data/HVnmMxH1/versions/RKfUB9VC/ComplementaryReimagined_r5.10.zip
    continue-on-error: ${{ matrix.shaders != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Caché de Bloomberto
        uses: actions/cache@v4
        with:
          path: libs/bloomberto
          key: bloomberto-${{ hashFiles('bloomberto.ref') }}

      - name: Compilar Bloomberto
        run: |
          chmod +x scripts/fetch-bloomberto.sh
          scripts/fetch-bloomberto.sh

      - name: Pantalla virtual y OpenGL por software
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick

      - name: Self-test cliente con ${{ matrix.mods }} ${{ matrix.shaders != '' && '+ shaders' || '' }} (${{ matrix.target }})
        env:
          RENDER_MODS: ${{ matrix.mods }}
          SHADER_PACK_URL: ${{ matrix.shaders }}
          JAVA_TOOL_OPTIONS: ${{ matrix.irisProgram && format('-Dstormroot.irisProgram={0}', matrix.irisProgram) || '' }}
          SELFTEST_EXTRA_TAG: ${{ matrix.irisProgram && format('+{0}', matrix.irisProgram) || '' }}
        run: |
          chmod +x ./gradlew scripts/selftest.sh scripts/selftest-client-xvfb.sh
          scripts/selftest.sh client ${{ matrix.target }}

      - name: API de Iris (programas y cómo se asignan)
        if: always() && matrix.shaders != ''
        run: |
          mc="${{ matrix.target }}"; mc="${mc%-fabric}"
          jar=$(find ~/.gradle .gradle -name "iris-*+${mc}*.jar" -path '*modrinth*' 2>/dev/null | head -1)
          echo "jar: $jar"
          [ -n "$jar" ] || exit 0
          javap -cp "$jar" net.irisshaders.iris.api.v0.IrisProgram || true
          javap -c -p -cp "$jar" net.irisshaders.iris.apiimpl.IrisApiV0Impl | sed -n '/assignPipeline/,/^$/p' | head -80 || true
          grep -E "Iris: programas|no aceptó|no permite" run/logs/latest.log || true

      - name: Logs del self-test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-render-logs-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            build/selftest-logs/
            run/logs/

  # Multijugador: servidor dedicado + dos clientes a la vez (Alba bajo una tormenta, Berto lejos y despejado).
  selftest-mp:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.11-fabric
          - 1.21.11-neoforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Caché de Bloomberto
        uses: actions/cache@v4
        with:
          path: libs/bloomberto
          key: bloomberto-${{ hashFiles('bloomberto.ref') }}

      - name: Compilar Bloomberto
        run: |
          chmod +x scripts/fetch-bloomberto.sh
          scripts/fetch-bloomberto.sh

      - name: Pantalla virtual y OpenGL por software
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick

      - name: Multijugador (${{ matrix.target }})
        run: |
          chmod +x ./gradlew scripts/selftest-mp.sh
          scripts/selftest-mp.sh ${{ matrix.target }}
